root: .
extends: theme-check:recommended

# Theme Check ships with Shopify CLI. Run: npm run check

# OrphanedSnippet is disabled: with Shopify CLI 5.0.1 it flags every snippet,
# even one rendered directly from layout/theme.liquid (verified 2026-11-17 in a
# scratch copy). Re-enable after a CLI update and check that it reports only
# real orphans.
OrphanedSnippet:
  enabled: false
